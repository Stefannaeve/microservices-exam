name: Build and Push Docker Image

on:
  push:
    branches:
      - workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short commit SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set environment variables
        run: echo "IMAGE_TAG=${{ env.SHORT_SHA }}" >> $GITHUB_ENV

      - name: Check Docker version
        run: docker version

      - name: Debug Environment Variables
        run: |
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}"
          echo "IMAGE_TAG=${IMAGE_TAG}"


      - name: Build Docker images with docker-compose
        working-directory: ./docker
        run: docker compose build

      - name: Tag images with 'latest'
        working-directory: ./docker
        run: |
          services=(gateway book comment user manager)
          for service in "${services[@]}"; do
            docker tag "${{ secrets.DOCKERHUB_USERNAME }}/microservices:${IMAGE_TAG}-${service}" "${{ secrets.DOCKERHUB_USERNAME }}/microservices:latest-${service}"
          done

      - name: Push Docker images
        working-directory: ./docker
        run: |
          services=(gateway book comment user manager)
          for service in "${services[@]}"; do
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/microservices:${IMAGE_TAG}-${service}"
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/microservices:latest-${service}"
          done